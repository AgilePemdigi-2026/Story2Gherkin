name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: story2gherkin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d story2gherkin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: "postgres://ci:ci_password@localhost:5432/story2gherkin_test?sslmode=disable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Analyze Go code
        run: go vet ./...

      - name: Test backend
        run: go test -race -count=1 -timeout=5m ./...

      - name: Build backend
        run: go build ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    env:
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Add npm test after a frontend test suite and test script are available.
      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build

  review-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ai-service/requirements.txt
            ai-service/requirements-dev.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      # Existing legacy conftest imports moved modules; review tests are isolated.
      - name: Test review validator without LLM calls
        run: python -m pytest tests/unit/test_review_validation.py tests/api/test_review_api.py --noconftest -q -o addopts=

  deploy-production:
    name: Queue Coolify production deployment
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [backend, frontend, review-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Trigger Coolify deploy webhook
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping deployment because main has advanced."
            exit 0
          fi

          : "${COOLIFY_DEPLOY_WEBHOOK:?Set the COOLIFY_DEPLOY_WEBHOOK production secret}"
          : "${COOLIFY_TOKEN:?Set the COOLIFY_TOKEN production secret}"
          response=$(curl --fail --silent --show-error --max-time 30 --proto '=https' \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK")

          if ! jq -e 'any(.deployments[]?; (.deployment_uuid // "") != "")' >/dev/null 2>&1 <<< "$response"; then
            echo "::error::Coolify did not return a queued deployment."
            exit 1
          fi
          echo "Coolify queued the production deployment."
