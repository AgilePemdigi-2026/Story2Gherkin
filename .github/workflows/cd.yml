name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-production:
    name: Queue Coolify production deployment
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - name: Trigger Coolify deploy webhook
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          main_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$main_sha" != "$CI_HEAD_SHA" ]]; then
            echo "Skipping deployment because main has advanced."
            exit 0
          fi

          : "${COOLIFY_DEPLOY_WEBHOOK:?Set the COOLIFY_DEPLOY_WEBHOOK production secret}"
          : "${COOLIFY_TOKEN:?Set the COOLIFY_TOKEN production secret}"
          response=$(curl --request POST --fail --silent --show-error --max-time 30 --proto '=https' \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_DEPLOY_WEBHOOK")

          if ! jq -e 'any(.deployments[]?; (.deployment_uuid // "") != "")' >/dev/null 2>&1 <<< "$response"; then
            echo "::error::Coolify did not return a queued deployment."
            exit 1
          fi
          echo "Coolify queued the production deployment."
