services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS}
      POSTGRES_DB: ${DB_NAME:-story2gherkin_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASS: ${DB_PASS:?Set DB_PASS}
      DB_NAME: ${DB_NAME:-story2gherkin_db}
      GOLANG_PORT: "8888"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
    restart: unless-stopped

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Docker/Dockerfile
    environment:
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set AI_SERVICE_KEY}
      LLM_PROVIDER: ollama
      OLLAMA_URL: ${OLLAMA_URL:?Set OLLAMA_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL:?Set OLLAMA_MODEL}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Docker/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: